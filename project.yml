name: petable
options:
  bundleIdPrefix: com.egorproskurin
  deploymentTarget:
    macOS: "14.0"
packages:
  GraphCore:
    path: .
targets:
  petableUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - App/UITests
    dependencies:
      - target: petable
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: petable
        GENERATE_INFOPLIST_FILE: true
  petable:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Assets.xcassets
    dependencies:
      - package: GraphCore
        product: GraphCore
      - package: GraphCore
        product: AgentRuntime
      - package: GraphCore
        product: OrgEngine
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.egorproskurin.petable
        # Стабильная подпись (Apple Development из Xcode) вместо ad-hoc:
        # ad-hoc менялась каждую пересборку, и Keychain/TCC считали каждую
        # установку НОВЫМ приложением — «Разрешить всегда» не переживало
        # make run. Со стабильной identity разрешение выдаётся один раз.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: AL84K6U294
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
    # SHA и путь репо сборки — для самообновления (UpdateService):
    # скрипт-фаза бежит ДО подписи, правка Info.plist продукта безопасна.
    postBuildScripts:
      # Бинарь демона — в ресурсы бандла: установка движка из приложения
      # (П0) копирует его в ~/Library/Application Support/Petable.
      # env -i: xcodebuild-окружение ломает вложенный swift build.
      - name: Embed daemon
        basedOnDependencyAnalysis: false
        script: |
          set -e
          /usr/bin/env -i HOME="$HOME" PATH="/usr/bin:/bin:/usr/local/bin" \
            /usr/bin/xcrun swift build -c release --product petable-daemon \
            --package-path "$PROJECT_DIR"
          RES="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$RES"
          cp "$PROJECT_DIR/.build/release/petable-daemon" "$RES/petable-daemon"
          # Демон — той же стабильной подписью, что и приложение (иначе
          # его TCC-разрешения слетали бы при каждой пересборке).
          codesign --force --sign "Apple Development" "$RES/petable-daemon" 2>/dev/null \
            || codesign --force --sign - "$RES/petable-daemon"
      - name: Embed build SHA
        basedOnDependencyAnalysis: false
        script: |
          PLIST="$BUILT_PRODUCTS_DIR/$INFOPLIST_PATH"
          [ -f "$PLIST" ] || exit 0
          SHA=$(cd "$PROJECT_DIR" && /usr/bin/git rev-parse HEAD 2>/dev/null || echo unknown)
          /usr/libexec/PlistBuddy -c "Set :PetableBuildSHA $SHA" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :PetableBuildSHA string $SHA" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :PetableRepoPath $PROJECT_DIR" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :PetableRepoPath string $PROJECT_DIR" "$PLIST"
